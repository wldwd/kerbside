<!DOCTYPE html>
<html lang="en-AU" data-scheme="night">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Kerbside Escape Pod</title>
    <meta
      name="description"
      content="A break from the news: an endless scroll of street patterns, bike parts, shapes and colours."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect width='8' height='8' fill='%231D2B53'/><rect x='1' y='1' width='3' height='3' fill='%23FF77A8'/><rect x='4' y='1' width='3' height='3' fill='%2300E436'/><rect x='1' y='4' width='3' height='3' fill='%2329ADFF'/><rect x='4' y='4' width='3' height='3' fill='%23FFEC27'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pixel: "Press Start 2P", "Courier New", monospace;
        --sans: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
      }

      /* ---------- Colour schemes for the page itself ----------
         The tile colours for each scheme are in the script below. */
      html[data-scheme="night"] {
        --page: #07070f;
        --dots: rgba(255, 255, 255, 0.06);
        --panel: #0e0e1c;
        --ink: #f4f4ff;
        --line: #7a7ac2;
        --pill: #1c1c38;
        --on: #00f0ff;
        --on-edge: #00f0ff;
        --on-ink: #07070f;
        --title: #ff2e88;
        --title-shadow: #00f0ff;
        --focus: #ffe500;
        --tile-shadow: none; /* tiles glow instead (set in the script) */
      }
      html[data-scheme="day"] {
        --page: #fff7e6;
        --dots: rgba(26, 26, 46, 0.09);
        --panel: #ffffff;
        --ink: #1a1a2e;
        --line: #1a1a2e;
        --pill: #ffffff;
        --on: #ff2e88;
        --on-edge: #1a1a2e;
        --on-ink: #1a1a2e;
        --title: #d6005f;
        --title-shadow: #1a1a2e;
        --focus: #1a1a2e;
        --tile-shadow: 5px 5px 0 0 #1a1a2e;
      }
      html[data-scheme="pastel"] {
        --page: #fbf6ef;
        --dots: rgba(110, 115, 168, 0.12);
        --panel: #ffffff;
        --ink: #3f4370;
        --line: #8f8ac4;
        --pill: #ffffff;
        --on: #c3a6e6;
        --on-edge: #6a5fc4;
        --on-ink: #2e3160;
        --title: #6a5fc4;
        --title-shadow: #f7c6d9;
        --focus: #3f4370;
        --tile-shadow: 5px 5px 0 0 rgba(110, 115, 168, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: var(--sans);
        background: radial-gradient(
              circle,
              var(--dots) 1px,
              transparent 1.6px
            )
            0 0 / 10px 10px,
          var(--page);
        transition: background-color 0.6s ease;
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      /* ---------- Top bar: stays in view while you scroll ---------- */
      .bar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--panel);
        border-bottom: 2px solid var(--line);
      }
      .bar h1 {
        margin: 0 auto 0 0;
        font-family: var(--pixel);
        font-weight: 400;
        font-size: clamp(0.8rem, 2.2vw, 1.1rem);
        line-height: 1.6;
        color: var(--title);
        text-shadow: 2px 2px 0 var(--title-shadow);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .pill {
        font-family: var(--pixel);
        font-size: 0.6rem;
        line-height: 1.6;
        color: var(--ink);
        background: var(--pill);
        border: 2px solid var(--line);
        border-radius: 999px;
        padding: 0.5rem 0.8rem;
        cursor: pointer;
        text-decoration: none;
      }
      .pill:hover {
        border-color: var(--on);
      }
      .pill[aria-pressed="true"] {
        background: var(--on);
        border-color: var(--on-edge);
        color: var(--on-ink);
      }

      /* ---------- The tiles ---------- */
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 3rem;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }
      .tile {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        padding: 0;
        border: 0;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        /* Shows the tile's main colour while its pattern is being drawn */
        background: var(--a, var(--panel));
        box-shadow: var(--tile-shadow);
        transition: background-color 0.7s ease, box-shadow 0.7s ease;
      }
      .tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Each tile has three colours: a (background), b and c */
      .a { fill: var(--a); }
      .b { fill: var(--b); }
      .c { fill: var(--c); }
      .sb { fill: none; stroke: var(--b); }
      .sc { fill: none; stroke: var(--c); }
      .a, .b, .c { transition: fill 0.7s ease; }
      .sb, .sc { transition: stroke 0.7s ease; }

      /* Gentle motion on a few patterns */
      .d24 { animation: d24 9s linear infinite; }
      .d20 { animation: d20 8s linear infinite; }
      .spin { animation: spin 40s linear infinite; transform-origin: 50px 50px; }
      @keyframes d24 { to { transform: translateX(24px); } }
      @keyframes d20 { to { transform: translateX(20px); } }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* A little squish when you tap a tile */
      .boop { animation: boop 0.35s ease; }
      @keyframes boop { 40% { transform: scale(0.93); } }

      /* Bubble wrap: each dot on a tactile paving tile can be pressed down */
      .dome { transform-box: fill-box; transform-origin: center; transition: transform 0.15s ease, opacity 0.15s ease; }
      .dome .shine { transition: opacity 0.15s ease; }
      .dome.popped { transform: scale(0.7); opacity: 0.45; }
      .dome.popped .shine { opacity: 0; }
      .dome.pop { animation: pop 0.2s ease; }
      .dome.grow { animation: grow 0.35s ease; }
      @keyframes pop { 50% { transform: scale(0.5); } }
      @keyframes grow { 0% { transform: scale(0.7); opacity: 0.45; } 70% { transform: scale(1.1); opacity: 1; } }

      /* No motion at all if the device asks for less motion */
      @media (prefers-reduced-motion: reduce) {
        .d24, .d20, .spin, .boop, .dome.pop, .dome.grow { animation: none; }
        .tile, .a, .b, .c, .sb, .sc { transition-duration: 0.2s; }
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (max-width: 600px) {
        .bar { padding: 0.6rem 1rem; }
        /* Phones: title and Back on the first row, schemes on the second */
        #back { order: 2; }
        .controls { order: 3; flex-basis: 100%; }
        .pill { font-size: 0.55rem; padding: 0.45rem 0.7rem; }
        .wrap { padding: 1rem 1rem 3rem; }
        .tiles { gap: 12px; }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>Escape Pod</h1>
      <div class="controls" role="group" aria-label="Colour scheme">
        <button class="pill" data-scheme="night" type="button" aria-pressed="true">
          Neon Night
        </button>
        <button class="pill" data-scheme="day" type="button" aria-pressed="false">
          Neon Day
        </button>
        <button class="pill" data-scheme="pastel" type="button" aria-pressed="false">
          Pastel
        </button>
      </div>
      <a class="pill" id="back" href="./">Back to the news</a>
    </header>

    <main class="wrap">
      <p class="visually-hidden">
        An endless scroll of street patterns and bike parts. Tap any tile to
        change its colours. Tactile paving tiles are bubble wrap: tap them to
        pop a bubble.
      </p>
      <div class="tiles" id="tiles"></div>
      <div id="end"></div>
      <noscript><p>The Escape Pod needs JavaScript to draw its patterns.</p></noscript>
    </main>

    <script>
      // ---------- Settings ----------
      const BATCH = 24; // tiles added each time you get near the bottom
      const BIKE_CHANCE = 1 / 6; // how often a bike part appears

      // Tile colours for each scheme. Each tile gets one background colour
      // and two pattern colours. swap: how often background and pattern
      // trade places. glow: tiles glow in their pattern colour.
      const SCHEMES = {
        night: {
          backgrounds: ["#0B0B1A", "#14002E", "#001A22", "#1F0016", "#0A1A00", "#101024"],
          patterns: ["#FF2E88", "#00F0FF", "#B6FF00", "#FFE500", "#FF7A00",
                     "#A64BFF", "#39FF14", "#FF3B3B"],
          swap: 0.12,
          glow: true,
        },
        day: {
          backgrounds: ["#FF2E88", "#B6FF00", "#00E5FF", "#FFE500", "#FF7A00", "#A64BFF"],
          patterns: ["#FFFFFF", "#1A1A2E", "#FF2E88", "#00E5FF", "#FFE500",
                     "#B6FF00", "#FF7A00", "#A64BFF"],
          swap: 0.2,
        },
        pastel: {
          backgrounds: ["#FDE2E4", "#E2F0EA", "#FFF1E0", "#E0E8FD", "#EFE6F7", "#FFF8D6"],
          patterns: ["#F4A6B8", "#8FD3BD", "#FFC48C", "#9DB4F0", "#C3A6E6",
                     "#F3DC7A", "#6E73A8", "#FFFFFF"],
          swap: 0.2,
        },
      };

      // ---------- Helpers ----------

      // A random number generator that repeats from a seed, so a tile
      // looks the same when it scrolls back into view
      function seeded(seed) {
        return function () {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const between = (rand, a, b) => a + rand() * (b - a);
      const f1 = (v) => v.toFixed(1);
      const around = (r, angle) =>
        `${f1(50 + r * Math.cos(angle))},${f1(50 + r * Math.sin(angle))}`;

      // A toothed ring, used for the chainring and the cassette
      function gear(outer, inner, teeth, cls) {
        const points = [];
        const root = (Math.PI / teeth) * 0.55;
        const tip = (Math.PI / teeth) * 0.3;
        for (let i = 0; i < teeth; i++) {
          const a = (i / teeth) * Math.PI * 2;
          points.push(around(inner, a - root), around(outer, a - tip),
                      around(outer, a + tip), around(inner, a + root));
        }
        return `<polygon class="${cls}" points="${points.join(" ")}"/>`;
      }

      // ---------- Patterns ----------
      // Each pattern draws inside a 100 x 100 square.
      // turn: true means it can be rotated for extra variety.

      const STREET = [
        {
          // Bubble wrap: 25 dots in a 5 x 5 grid, numbered row by row
          name: "Tactile paving",
          bubble: true,
          draw() {
            let s = "";
            for (let j = 0; j < 5; j++)
              for (let i = 0; i < 5; i++) {
                const x = 14 + 18 * i, y = 14 + 18 * j;
                s += `<g class="dome"><circle class="b" cx="${x}" cy="${y}" r="6.5"/>` +
                     `<circle class="c shine" cx="${x - 1.8}" cy="${y - 1.8}" r="2.2"/></g>`;
              }
            return s;
          },
        },
        {
          name: "Zebra crossing",
          turn: true,
          draw() {
            let s = '<g class="d24">';
            for (let x = -24; x < 124; x += 24)
              s += `<rect class="b" x="${x}" y="14" width="12" height="72"/>`;
            return s + '</g><rect class="c" x="0" y="5" width="100" height="4"/>' +
                       '<rect class="c" x="0" y="91" width="100" height="4"/>';
          },
        },
        {
          name: "Curved paths",
          draw(rand) {
            let s = "";
            const r = 12.5;
            for (let i = 0; i < 4; i++)
              for (let j = 0; j < 4; j++) {
                const x = i * 25, y = j * 25;
                const d = rand() < 0.5
                  ? `M${x + r} ${y}A${r} ${r} 0 0 1 ${x} ${y + r}M${x + 25} ${y + r}A${r} ${r} 0 0 0 ${x + r} ${y + 25}`
                  : `M${x + r} ${y}A${r} ${r} 0 0 0 ${x + 25} ${y + r}M${x} ${y + r}A${r} ${r} 0 0 1 ${x + r} ${y + 25}`;
                s += `<path class="sb" stroke-width="5" stroke-linecap="round" d="${d}"/>`;
              }
            return s;
          },
        },
        {
          name: "Brick bond",
          turn: true,
          draw(rand) {
            let s = "";
            for (let row = 0; row < 8; row++) {
              const offset = row % 2 ? -12.5 : 0;
              for (let x = offset; x < 100; x += 25)
                s += `<rect class="${rand() < 0.18 ? "c" : "b"}" x="${x + 1}" y="${row * 12.5 + 1}" width="23" height="10.5" rx="1.5"/>`;
            }
            return s;
          },
        },
        {
          name: "Manhole cover",
          draw() {
            let s = '<circle class="b" cx="50" cy="50" r="45"/>' +
                    '<circle class="a" cx="50" cy="50" r="39.5"/>' +
                    '<circle class="b" cx="50" cy="50" r="36"/>';
            for (let gx = -30; gx <= 30; gx += 8.5)
              for (let gy = -30; gy <= 30; gy += 8.5)
                if (Math.hypot(gx, gy) < 28) {
                  const cx = 50 + gx, cy = 50 + gy;
                  s += `<rect class="c" x="${cx - 2.5}" y="${cy - 2.5}" width="5" height="5" rx="1" transform="rotate(45 ${cx} ${cy})"/>`;
                }
            for (let k = 0; k < 16; k++) {
              const t = (k / 16) * Math.PI * 2;
              s += `<circle class="a" cx="${f1(50 + 42.2 * Math.cos(t))}" cy="${f1(50 + 42.2 * Math.sin(t))}" r="1.5"/>`;
            }
            return s;
          },
        },
        {
          name: "Kerb stripes",
          turn: true,
          draw() {
            let s = '<g transform="rotate(45 50 50)"><g class="d20">';
            for (let x = -100; x < 200; x += 20)
              s += `<rect class="b" x="${x}" y="-50" width="10" height="200"/>`;
            return s + "</g></g>";
          },
        },
        {
          name: "Terrazzo",
          draw(rand) {
            let s = "";
            for (let k = 0; k < 34; k++) {
              const cx = between(rand, 0, 100), cy = between(rand, 0, 100);
              const size = between(rand, 2, 7);
              const corners = 3 + Math.floor(rand() * 3);
              const start = between(rand, 0, 6.28);
              const pts = [];
              for (let q = 0; q < corners; q++) {
                const t = start + (q / corners) * 6.28 + between(rand, -0.4, 0.4);
                const rr = size * between(rand, 0.6, 1.1);
                pts.push(`${f1(cx + rr * Math.cos(t))},${f1(cy + rr * Math.sin(t))}`);
              }
              s += `<polygon class="${rand() < 0.65 ? "b" : "c"}" points="${pts.join(" ")}"/>`;
            }
            for (let k = 0; k < 30; k++)
              s += `<circle class="c" cx="${f1(between(rand, 0, 100))}" cy="${f1(between(rand, 0, 100))}" r="${f1(between(rand, 0.8, 1.6))}"/>`;
            return s;
          },
        },
        {
          name: "Give way markings",
          turn: true,
          draw() {
            let s = "";
            for (const y of [16, 46, 76]) {
              s += `<rect class="c" x="0" y="${y - 8}" width="100" height="3"/>`;
              for (let k = 0; k < 5; k++) {
                const x = 1 + k * 20;
                s += `<polygon class="b" points="${x},${y} ${x + 18},${y} ${x + 9},${y + 16}"/>`;
              }
            }
            return s;
          },
        },
        {
          name: "Tree grate",
          draw() {
            let s = '<circle class="b" cx="50" cy="50" r="46"/>' +
                    '<circle class="c" cx="50" cy="50" r="13"/>';
            for (const [r, n] of [[21, 12], [30, 18], [39, 24]])
              for (let k = 0; k < n; k++)
                s += `<rect class="a" x="48.5" y="${50 - r - 4}" width="3" height="8" rx="1.5" transform="rotate(${f1((360 / n) * k + (r % 2 ? 7 : 0))} 50 50)"/>`;
            return s;
          },
        },
        {
          name: "Cobbles",
          draw(rand) {
            let s = "";
            const cell = 100 / 7;
            for (let i = 0; i < 7; i++)
              for (let j = 0; j < 7; j++)
                s += `<rect class="${rand() < 0.12 ? "c" : "b"}" x="${f1(i * cell + 1.5 + between(rand, -0.8, 0.8))}" y="${f1(j * cell + 1.5 + between(rand, -0.8, 0.8))}" width="${f1(cell - 3)}" height="${f1(cell - 3)}" rx="3"/>`;
            return s;
          },
        },
        {
          name: "Drain grate",
          turn: true,
          draw() {
            let s = '<rect class="b" x="6" y="6" width="88" height="88" rx="6"/>';
            for (let i = 0; i < 7; i++)
              s += `<rect class="a" x="${15 + i * 11}" y="16" width="5" height="68" rx="2.5"/>`;
            for (const [x, y] of [[11, 11], [89, 11], [11, 89], [89, 89]])
              s += `<circle class="c" cx="${x}" cy="${y}" r="2.5"/>`;
            return s;
          },
        },
        {
          name: "Ripples",
          draw() {
            let s = "";
            let i = 0;
            for (let r = 46; r > 0; r -= 8)
              s += `<circle class="${i++ % 2 ? "c" : "b"}" cx="50" cy="50" r="${r}"/>`;
            return s;
          },
        },
      ];

      const BIKE = [
        {
          name: "Bike wheel",
          draw() {
            let s = '<g class="spin"><circle class="b" cx="50" cy="50" r="46"/>' +
                    '<circle class="a" cx="50" cy="50" r="41.5"/>' +
                    '<circle class="sc" cx="50" cy="50" r="38.5" stroke-width="2.5"/>';
            for (let k = 0; k < 32; k++) {
              const t = (k / 32) * Math.PI * 2;
              const rim = t + (k % 2 ? 0.6 : -0.6);
              s += `<line class="sc" stroke-width="0.9" x1="${f1(50 + 6 * Math.cos(t))}" y1="${f1(50 + 6 * Math.sin(t))}" x2="${f1(50 + 37 * Math.cos(rim))}" y2="${f1(50 + 37 * Math.sin(rim))}"/>`;
            }
            return s + '<circle class="c" cx="50" cy="50" r="6.5"/>' +
                       '<circle class="a" cx="50" cy="50" r="2.5"/>' +
                       '<rect class="c" x="48.5" y="5" width="3" height="5" rx="1"/></g>';
          },
        },
        {
          name: "Chainring",
          draw() {
            let s = gear(45, 39.5, 30, "b") + '<circle class="a" cx="50" cy="50" r="33.5"/>';
            for (let k = 0; k < 5; k++)
              s += `<rect class="b" x="46" y="18" width="8" height="34" rx="4" transform="rotate(${k * 72} 50 50)"/>` +
                   `<circle class="c" cx="50" cy="21.5" r="2" transform="rotate(${k * 72} 50 50)"/>`;
            return s + '<circle class="b" cx="50" cy="50" r="12"/><circle class="c" cx="50" cy="50" r="5"/>';
          },
        },
        {
          name: "Bike chain",
          turn: true,
          draw() {
            let s = "";
            for (const y of [22, 50, 78]) {
              s += '<g class="d20">';
              for (let x = -40; x < 120; x += 20)
                s += `<rect class="${(x / 20) % 2 ? "c" : "b"}" x="${x}" y="${y - 7}" width="24" height="14" rx="7"/>` +
                     `<circle class="a" cx="${x + 6}" cy="${y}" r="2.6"/>` +
                     `<circle class="a" cx="${x + 18}" cy="${y}" r="2.6"/>`;
              s += "</g>";
            }
            return s;
          },
        },
        {
          name: "Cassette",
          draw() {
            let s = "";
            let i = 0;
            for (const [outer, teeth] of [[46, 34], [37.5, 28], [29.5, 22], [21.5, 16]])
              s += gear(outer, outer - 4.5, teeth, i++ % 2 ? "c" : "b") +
                   `<circle class="a" cx="50" cy="50" r="${outer - 6.5}"/>`;
            return s + '<circle class="b" cx="50" cy="50" r="10"/><circle class="a" cx="50" cy="50" r="5"/>';
          },
        },
      ];

      // ---------- Colours ----------
      let scheme = "night";
      try {
        const saved = localStorage.getItem("escape-scheme");
        if (saved in SCHEMES) scheme = saved;
      } catch (e) {}

      const pickIndex = (n) => Math.floor(Math.random() * n);

      // Random numbers that work in any scheme, so a tile keeps its "slot"
      // when you switch schemes
      function pickColours() {
        return { a: pickIndex(60), b: pickIndex(60), c: pickIndex(60), swap: Math.random() };
      }

      function paint(tile) {
        const set = SCHEMES[scheme];
        const k = tile.colours;
        const bg = set.backgrounds[k.a % set.backgrounds.length];
        // Pattern colours are never the same as the background or each other
        let choices = set.patterns.filter((c) => c !== bg);
        const one = choices[k.b % choices.length];
        choices = choices.filter((c) => c !== one);
        const two = choices[k.c % choices.length];
        const [a, b, c] = k.swap < set.swap ? [one, bg, two] : [bg, one, two];
        tile.style.setProperty("--a", a);
        tile.style.setProperty("--b", b);
        tile.style.setProperty("--c", c);
        tile.style.boxShadow = set.glow ? `0 0 16px -3px ${b}` : "";
      }

      // ---------- Tiles ----------
      const tiles = document.getElementById("tiles");
      const recent = []; // last few patterns, so neighbours don't repeat

      function choosePattern() {
        const list = Math.random() < BIKE_CHANCE ? BIKE : STREET;
        let pattern;
        do pattern = list[pickIndex(list.length)];
        while (recent.includes(pattern));
        recent.push(pattern);
        if (recent.length > 3) recent.shift();
        return pattern;
      }

      // Draw a tile's pattern (only done when it's near the screen)
      function draw(tile) {
        if (tile.firstChild) return;
        const p = tile.pattern;
        const inner = p.draw(seeded(tile.seed));
        const turned = tile.turn ? `<g transform="rotate(${tile.turn} 50 50)">${inner}</g>` : inner;
        tile.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect class="a" width="100" height="100"/>${turned}</svg>`;
        // Bubble wrap remembers which bubbles were popped
        if (tile.popped)
          tile.querySelectorAll(".dome").forEach((d, i) => d.classList.toggle("popped", tile.popped.has(i)));
      }

      // Remove a pattern that's far off screen, to keep the page light
      function undraw(tile) {
        tile.textContent = "";
      }

      const nearScreen = new IntersectionObserver(
        (entries) => {
          for (const e of entries) (e.isIntersecting ? draw : undraw)(e.target);
        },
        { rootMargin: "800px 0px" }
      );

      function addTile() {
        const tile = document.createElement("button");
        tile.type = "button";
        tile.className = "tile";
        tile.pattern = choosePattern();
        tile.seed = pickIndex(1e9);
        tile.turn = tile.pattern.turn ? 90 * pickIndex(4) : 0;
        tile.colours = pickColours();
        if (tile.pattern.bubble) {
          tile.popped = new Set();
          tile.setAttribute("aria-label", "Bubble wrap. Tap to pop a bubble");
        } else {
          tile.setAttribute("aria-label", `${tile.pattern.name}. Tap to change its colours`);
        }
        paint(tile);
        tiles.appendChild(tile);
        nearScreen.observe(tile);
      }

      // Restart a CSS animation on an element
      function restart(el, name) {
        el.classList.remove(name);
        void el.getBoundingClientRect();
        el.classList.add(name);
      }

      // ---------- Bubble wrap ----------

      // Which bubble is under the pointer (0 to 24)
      function bubbleAt(tile, event) {
        const box = tile.getBoundingClientRect();
        const x = ((event.clientX - box.left) / box.width) * 100;
        const y = ((event.clientY - box.top) / box.height) * 100;
        const col = Math.min(4, Math.max(0, Math.round((x - 14) / 18)));
        const row = Math.min(4, Math.max(0, Math.round((y - 14) / 18)));
        return row * 5 + col;
      }

      function pop(tile, i) {
        if (tile.refilling || i < 0 || tile.popped.has(i)) return;
        tile.popped.add(i);
        const dome = tile.querySelectorAll(".dome")[i];
        if (dome) {
          dome.classList.add("popped");
          restart(dome, "pop");
        }
        if (tile.popped.size === 25) refill(tile);
      }

      // When every bubble is popped, refill with new colours
      function refill(tile) {
        tile.refilling = true;
        setTimeout(() => {
          tile.popped.clear();
          tile.colours = pickColours();
          paint(tile);
          tile.querySelectorAll(".dome").forEach((dome, i) =>
            setTimeout(() => {
              dome.classList.remove("popped", "pop");
              restart(dome, "grow");
            }, i * 40)
          );
          setTimeout(() => (tile.refilling = false), 25 * 40);
        }, 900);
      }

      // With a mouse, bubbles pop as soon as you press, and you can drag
      // across to pop a row. On touch screens they pop when you tap, so
      // swiping still scrolls the page.
      let lastPointer = "";
      tiles.addEventListener("pointerdown", (event) => {
        lastPointer = event.pointerType;
        const tile = event.target.closest(".tile");
        if (tile && tile.pattern.bubble && event.pointerType === "mouse" && event.button === 0)
          pop(tile, bubbleAt(tile, event));
      });
      tiles.addEventListener("pointermove", (event) => {
        if (event.pointerType !== "mouse" || event.buttons !== 1) return;
        const tile = event.target.closest(".tile");
        if (tile && tile.pattern.bubble) pop(tile, bubbleAt(tile, event));
      });

      // ---------- Tapping tiles ----------
      tiles.addEventListener("click", (event) => {
        const tile = event.target.closest(".tile");
        if (!tile) return;

        if (tile.pattern.bubble) {
          if (event.detail === 0) {
            // Keyboard (Enter or Space): pop the next bubble
            let next = 0;
            while (tile.popped.has(next)) next++;
            pop(tile, next);
          } else if (lastPointer !== "mouse") {
            pop(tile, bubbleAt(tile, event));
            try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
          }
          return;
        }

        // Any other tile: new colours and a little squish
        tile.colours = pickColours();
        paint(tile);
        restart(tile, "boop");
      });

      // ---------- Endless scrolling ----------
      const end = document.getElementById("end");

      function fillScreen() {
        // Keep adding tiles until there's plenty below the screen
        let added = 0;
        while (end.getBoundingClientRect().top < window.innerHeight + 1200 && added < 240) {
          for (let i = 0; i < BATCH; i++) addTile();
          added += BATCH;
        }
      }

      new IntersectionObserver(
        (entries) => {
          if (entries[0].isIntersecting) fillScreen();
        },
        { rootMargin: "1200px 0px" }
      ).observe(end);
      fillScreen();

      // ---------- Neon Night, Neon Day and Pastel ----------
      const schemeButtons = document.querySelectorAll(".pill[data-scheme]");
      const colorMeta = document.querySelector('meta[name="color-scheme"]');

      function setScheme(name) {
        scheme = name;
        document.documentElement.dataset.scheme = name;
        colorMeta.content = name === "night" ? "dark" : "light";
        for (const button of schemeButtons)
          button.setAttribute("aria-pressed", button.dataset.scheme === name);
        for (const tile of tiles.children) paint(tile);
        try {
          localStorage.setItem("escape-scheme", name);
        } catch (e) {}
      }
      for (const button of schemeButtons)
        button.addEventListener("click", () => setScheme(button.dataset.scheme));
      setScheme(scheme);

      // ---------- Back to the news ----------
      // escape.html?from=sport goes back to the sport page; anything else
      // goes to the main page
      const back = document.getElementById("back");
      const from = new URLSearchParams(location.search).get("from");
      back.href = from === "sport" ? "sport.html" : "./";

      // If you came from a Kerbside page, step back instead, so your
      // filters and scroll position are still there
      back.addEventListener("click", (event) => {
        try {
          const ref = document.referrer && new URL(document.referrer);
          if (ref && ref.origin === location.origin && history.length > 1) {
            event.preventDefault();
            history.back();
          }
        } catch (e) {}
      });
    </script>
  </body>
</html>
