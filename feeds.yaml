# ---------------------------------------------------------------
# GOOGLE NEWS SEARCHES (Australian edition)
# Write queries as you would in Google News. The script builds the feed link.
# tag -> every story found by this search gets this topic tag.
# Only stories from Australian publishers are kept (see australian_sources).
# ---------------------------------------------------------------
google_news:
  - name: Walking
    query: 'walkability OR pedestrians OR footpaths OR "pedestrian crossing" OR "wombat crossing"'
    tag: Walking
  - name: Cycling
    query: '"bike lane" OR cycleway OR "shared path" OR "bike parking" -race -championships'
    tag: Cycling
  - name: Micromobility
    query: "e-scooter OR e-bike OR micromobility"
    tag: Micromobility
  - name: Public transport
    query: '"public transport" OR "light rail" OR "bus network" OR "train station"'
    tag: Public Transport
  - name: Road safety
    query: '"road safety" OR "speed limit" OR "30km/h" OR "Vision Zero"'
    tag: Road Safety
  - name: Roads
    query: '"induced demand" OR "road widening" OR "freeway expansion" OR tollway'
    tag: Roads
  - name: Parking
    query: '"parking minimums" OR "parking reform" OR "parking requirements"'
    tag: Parking
  - name: Streets
    query: '"street design" OR "school streets" OR "road space" OR "Healthy Streets" OR "modal filter" OR "low traffic neighbourhood"'
    tag: Streets
  - name: Public space
    query: 'placemaking OR "public space" OR laneway OR "pedestrian mall"'
    tag: Public Space
  - name: High streets
    query: '"high street" OR "main street" OR "town centre" OR "shopping strip"'
    tag: High Streets
  - name: Greening
    query: '"tree canopy" OR "street trees" OR "urban forest" OR "urban greening"'
    tag: Greening
  - name: Climate
    query: '"urban heat" OR "heat island" OR "climate adaptation" OR "urban flooding"'
    tag: Climate
  - name: Planning
    query: '"planning reform" OR "planning approval" OR "planning scheme" OR "development application"'
    tag: Planning
  - name: Zoning
    query: 'rezoning OR upzoning OR "height limits" OR "zoning rules"'
    tag: Zoning
  - name: Housing
    query: '"missing middle" OR infill OR "medium density" OR "housing density"'
    tag: Housing
  - name: Urban growth
    query: '"urban sprawl" OR greenfield OR "growth boundary" OR "outer suburbs"'
    tag: Urban Growth
  - name: Council finance
    query: '"council rates" OR "infrastructure backlog" OR "asset renewal" OR "financial sustainability" council'
    tag: Council Finance
  - name: Accessibility
    query: '"disability access" OR wheelchair OR "universal design" OR "age-friendly"'
    tag: Accessibility
  - name: Geospatial
    query: '(geospatial OR "digital twin" OR "spatial data" OR GIS OR LiDAR) (urban OR city OR council OR planning OR transport)'
    tag: Geospatial
  - name: Research
    query: '("new research" OR "study finds" OR researchers OR "new report") (walking OR cycling OR "public transport" OR housing OR "urban planning" OR streets)'
    tag: Research
  # Media coverage that mentions these organisations by name.
  # Useful for groups without their own feed (most university centres).
  - name: Advocacy mentions
    query: '"Bicycle Queensland" OR "Bike SA" OR "Bicycle SA" OR "Pedal Power ACT" OR "Committee for Sydney" OR "Committee for Perth" OR "Planning Institute of Australia" OR "Better Streets" OR "Victoria Walks" OR "Amy Gillett Foundation"'
  - name: Research centre mentions
    query: '"Centre for Urban Research" OR "Healthy Active Cities" OR "Henry Halloran" OR "Micromobility Research Cluster" OR PATREC OR "Australian Urban Design Research Centre" OR iMOVE OR "School of Design and the Built Environment" OR "Urban Cycling Institute" OR "Lab of Thought"'
    tag: Research
  - name: Urbanism
    query: 'urbanism OR urbanist OR liveability OR "urban design"'

# Google News stories are kept only if the publisher's website ends in .au
# or matches the list below. International stories still appear when
# these outlets cover them.
australian_sources:
  extra_domains:
    # Australian editions of global sites
    - theguardian.com
    - theconversation.com
    # Australian design and property media
    - theurbandeveloper.com
    - architectureau.com
    - landscapeaustralia.com
    # International urbanist media
    - theurbanist.org
    - nextcity.org
    - cnu.org
    - archdaily.com

# Stories from these publishers are always tagged with that region
