  NSW:
    [
      dailytelegraph.com.au,
      smh.com.au,
      newcastleherald.com.au,
      illawarramercury.com.au,
    ]
  VIC: [heraldsun.com.au, theage.com.au, geelongadvertiser.com.au]
  QLD:
    [
      couriermail.com.au,
      brisbanetimes.com.au,
      goldcoastbulletin.com.au,
      townsvillebulletin.com.au,
      cairnspost.com.au,
      inqld.com.au,
    ]
  WA: [perthnow.com.au, thewest.com.au, watoday.com.au, businessnews.com.au]
  SA: [adelaidenow.com.au, indaily.com.au]
  TAS: [themercury.com.au, examiner.com.au, pulsetasmania.com.au]
  ACT: [canberratimes.com.au]
  NT: [ntnews.com.au]
  International: [theurbanist.org, nextcity.org, cnu.org, archdaily.com]

# Stories from publishers whose name contains any of these are always dropped
blocked_publishers:
  - Kalkine

