# Urbanist News Australia - settings
# Edit this file to add sources or change keywords. No code changes needed.

site:
  title: Kerbside
  keep_days: 365 # remove saved stories older than this
  max_items: 5000 # maximum stories kept in the archive
  google_news_days: 30 # Google News searches only return stories this recent

# ---------------------------------------------------------------
# DIRECT FEEDS
# filter: true  -> general news; keep only stories matching relevance_keywords
# filter: false -> source is already on-topic; keep everything
# region        -> optional; always tag stories from this feed with this region
# ---------------------------------------------------------------
