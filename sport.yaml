# Kerbside Sport - settings
# Same format as feeds.yaml. Build it with:  python build.py sport.yaml

site:
  title: Kerbside Sport
  keep_days: 365 # remove saved stories older than this
  max_items: 5000 # maximum stories kept in the archive
  google_news_days: 30 # Google News searches only return stories this recent
  history_file: data/sport.json # its own archive, separate from the main site
  data_file: sport.json # the file docs/sport.html reads
  australian_only: false # international cycling media is welcome here

# ---------------------------------------------------------------
# DIRECT FEEDS
# All of these are cycling sites, so filter: false keeps every story.
# region -> optional; always tag stories from this feed with this region
# ---------------------------------------------------------------
feeds:
  # ----- Australian -----
  - name: RIDE Media
    url: https://www.ridemedia.com.au/feed/
    source_type: News
    filter: false

  - name: The Detour
    url: https://www.thedetour.online/blog-feed.xml
    source_type: News
    filter: false

  - name: Bicycling Australia
    url: https://bicyclingaustralia.com.au/feed/
    source_type: News
    filter: false

  - name: Australian Mountain Bike
    url: https://www.ambmag.com.au/feed/
    source_type: News
    filter: false

  - name: Flow Mountain Bike
    url: https://flowmountainbike.com/feed/
    source_type: News
    filter: false

  # ----- International -----
  - name: Cyclingnews
    url: https://www.cyclingnews.com/feeds.xml
    source_type: News
    filter: false
    region: International

  - name: Escape Collective
    url: https://escapecollective.com/feed/
    source_type: News
    filter: false
    region: International

  - name: Cycling Weekly
    url: https://www.cyclingweekly.com/feeds.xml
    source_type: News
    filter: false
    region: International

  - name: Velo
    url: https://velo.outsideonline.com/feed/
    source_type: News
    filter: false
    region: International

# ---------------------------------------------------------------
# GOOGLE NEWS SEARCHES
# Write queries as you would in Google News. The script builds the feed link.
# tag -> every story found by this search gets this topic tag.
# must_mention -> optional; only keep stories whose headline uses one of
#                 these words (Google matches loosely, so this cuts noise)
# ---------------------------------------------------------------
google_news:
  # ----- Sites without their own feed -----
  - name: Global Cycling Network
    query: "site:globalcyclingnetwork.com"
  - name: BikeRadar
    query: "site:bikeradar.com"
  # Catches AusCycling's own news and coverage that mentions them
  - name: AusCycling
    query: "AusCycling"

  # ----- Grassroots and urban riding -----
  # "alley cat" with a space catches events like the Purrth Alley Cat
  - name: Alleycats
    query: '("alleycat" OR "alley cat") (race OR bike OR cycling)'
    tag: Odd and Urban
    must_mention: [alleycat, alleycats, alley cat race, alley cat ride, Purrth]
  - name: Bike polo
    query: '"bike polo" OR "bicycle polo"'
    tag: Odd and Urban
    must_mention: [polo]
  - name: Fixed gear
    query: '"fixed gear" (bike OR bicycle OR fixie)'
    tag: Odd and Urban
    must_mention: [fixed gear, fixed-gear, fixie, fixies]
  - name: Cargo bike racing
    query: '"cargo bike" (race OR racing)'
    tag: Odd and Urban
    must_mention:
      [
        cargo bike race,
        cargo bike races,
        cargo bike racing,
        cargo bike racers,
        cargo bike championships,
        cargo bike grand prix,
      ]
  - name: Criteriums
    query: "criterium"
    tag: Racing
    must_mention: [criterium, criteriums, crit, crits]

# Stories from these publishers are always tagged with that region
publisher_regions:
  International:
    [
      globalcyclingnetwork.com,
      bikeradar.com,
      cyclingnews.com,
      cyclingweekly.com,
      escapecollective.com,
      outsideonline.com,
    ]

# Stories from publishers whose name contains any of these are always dropped
# (horse racing and share market sites also use the word "criterium")
blocked_publishers:
  - Kalkine
  - At The Races
  - Racing TV
  - Betfair

# ---------------------------------------------------------------
# FILTERING
# ---------------------------------------------------------------

# Only used by feeds marked filter: true (none at the moment)
relevance_keywords:
  - cycling
  - cyclist
  - bike
  - bicycle
  - race
  - racing

# Stories mentioning any of these are dropped from every source
exclude_keywords:
  # Motor sport and gym bikes
  - motorcycle
  - motorbike
  - dirt bike
  - motocross
  - spin class
  # Not cycling: a gas company, a Paris horse racecourse and a ski race
  - Criterium Energy
  - Longchamp
  - Première Neige

# ---------------------------------------------------------------
